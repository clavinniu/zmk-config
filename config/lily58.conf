# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable display and show battery percentage on nice!view
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Maximize BLE transmit power (+8 dBm) for strong connection stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable ZMK Studio / RPC support for KeyPeek
CONFIG_ZMK_STUDIO=y
